[package]
name = "vera-core"
version = "0.1.0"
edition = "2021"
authors = ["Even The Odds Foundry LLC <eventheoddsfoundry@gmail.com>"]
description = "VERA Substrata – deterministic, quantum-ready SB 253 / CARB attestation core. Zero-trust emissions receipts."
license = "Proprietary"
repository = "https://github.com/jabrahns-source/vera-substrata"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"

# Optional tiny HTTP surface for remote mode
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

[features]
default = ["cli"]
cli = []
remote = ["axum", "tokio", "tower-http"]

[[bin]]
name = "vera"
path = "src/main.rs"
